  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <text x="64" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#7dd3fc">OPERATIONS · CAPACITY · SIMULATION</text>
  <text x="64" y="139" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="850" fill="#f8fbff">MetalMueble MRP II</text>
